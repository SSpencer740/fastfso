{{define "content"}}
<h1 style="margin:0 0 8px 0;font-size:20px;font-weight:600;color:#111827;">Verification code</h1>
<p style="margin:0 0 24px 0;font-size:15px;color:#6b7280;line-height:1.5;">Enter this code to verify your identity. It expires in 10 minutes.</p>
<div style="text-align:center;padding:20px 0;">
  <span style="display:inline-block;font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;background-color:#f3f4f6;border-radius:8px;padding:16px 28px;font-family:'Courier New',Courier,monospace;">{{.Code}}</span>
</div>
<p style="margin:24px 0 0 0;font-size:14px;color:#9ca3af;line-height:1.5;">If you did not request this code, you can safely ignore this email.</p>
{{end}}
