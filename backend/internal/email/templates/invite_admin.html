{{define "content"}}
<h1 style="margin:0 0 8px 0;font-size:20px;font-weight:600;color:#111827;">You've been invited to {{.TenantName}}</h1>
<p style="margin:0 0 24px 0;font-size:15px;color:#6b7280;line-height:1.5;">You have been added as an administrator to <strong>{{.TenantName}}</strong> on fastFSO.</p>
<p style="margin:0 0 24px 0;font-size:15px;color:#6b7280;line-height:1.5;">You can log in to get started:</p>
<div style="text-align:center;padding:16px 0;">
  <a href="{{.AppURL}}/login" style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:6px;padding:12px 28px;">Log in to fastFSO</a>
</div>
<p style="margin:24px 0 0 0;font-size:14px;color:#9ca3af;line-height:1.5;">If you did not expect this invitation, you can safely ignore this email.</p>
{{end}}
