{{define "content"}}
<h2 style="margin:0 0 16px;font-size:20px;font-weight:700;color:#111827;">Your task submission was {{.Decision}}</h2>
<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151;">
  Hi {{.Name}},
</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#374151;">
  Your most recent task submission has been
  <span style="color:{{if eq .Decision "approved"}}#16a34a{{else}}#dc2626{{end}};font-weight:600;">{{.Decision}}</span>.
</p>
<div style="text-align:center;padding:8px 0 16px;">
  <a href="{{.AppURL}}/login" style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:6px;padding:12px 28px;">Open fastFSO</a>
</div>
{{end}}
